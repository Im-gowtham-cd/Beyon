spring:
  application:
    name: beyon-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/beyon}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baselineVersion: 0

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/beyon}
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8085}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    mongo:
      enabled: false

beyon:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 5000
    read-timeout: 30000
  appwrite:
    endpoint: ${APPWRITE_ENDPOINT:https://sgp.cloud.appwrite.io/v1}
    project-id: ${APPWRITE_PROJECT_ID:6a8f0bbf00106d9d9dc0}
    database-id: ${APPWRITE_DATABASE_ID:6a8f0bbf00106d9d9dc0}
    api-key: ${APPWRITE_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:beyon-dev-secret-key-change-in-production-minimum-32-chars}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
